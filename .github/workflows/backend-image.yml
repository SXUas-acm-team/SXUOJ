name: Backend jars and Docker image

on:
  push:
    branches: [main, master, 'codex/contest-security-*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test deployment tooling
        run: python3 -m unittest discover -s deploy/tests -v
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Run isolated Java regressions and export runnable jars
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/backend.Dockerfile
          target: artifacts
          platforms: linux/amd64
          outputs: type=local,dest=dist/backend
          cache-from: type=gha,scope=sxuoj-backend
          cache-to: type=gha,scope=sxuoj-backend,mode=max
      - name: Upload backend and judge jars
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-jars-${{ github.sha }}
          path: |
            dist/backend/backend.jar
            dist/backend/judgeserver.jar
            dist/backend/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Validate both runtime architectures without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/backend.Dockerfile
          target: backend
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=sxuoj-backend
          cache-to: type=gha,scope=sxuoj-backend,mode=max
      - name: Load test image for isolated Compose deployment checks
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/backend.Dockerfile
          target: backend
          platforms: linux/amd64
          load: true
          tags: sxuoj-backend:local-check
          cache-from: type=gha,scope=sxuoj-backend
      - name: Verify upgrade, automatic recovery, rollback and data preservation
        run: python3 deploy/tests/docker_smoke.py

  publish:
    name: Publish backend image
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') && vars.DOCKERHUB_USERNAME != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Resolve Docker Hub image name
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          echo "name=${DOCKERHUB_USERNAME,,}/sxuoj-backend" >> "$GITHUB_OUTPUT"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Use a version tag such as v1.1.0" >&2; exit 1; }
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create version image tag
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
      - name: Push main backend image (judge runtime is managed separately)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/backend.Dockerfile
          target: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sxuoj-backend
          cache-to: type=gha,scope=sxuoj-backend,mode=max
